# Secret: Stores sensitive data (passwords) in base64 encoding
# In production, use tools like Sealed Secrets or External Secrets Operator
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: contract-analyzer
type: Opaque
data:
  # base64 encoded values (echo -n "postgres" | base64 = cG9zdGdyZXM=)
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  POSTGRES_DB: Y29udHJhY3RkYg==
