# ============================================================
# Redis — Caching & Rate Limiting Layer
# ============================================================

# PersistentVolumeClaim: Stores Redis AOF (Append Only File) data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: contract-analyzer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

# Deployment: Redis with persistence enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: contract-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc

# Service: Exposes Redis within the cluster
# Backend connects to "redis-service:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: contract-analyzer
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
