# ConfigMap: Stores non-sensitive configuration as key-value pairs
# Unlike Secrets, these values are plain text (not base64)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: contract-analyzer
data:
  # Database connection (uses the K8s Service name 'postgres-service' as hostname)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/contractdb"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "postgres"

  # Ollama connection (uses the K8s Service name 'ollama-service' as hostname)
  SPRING_AI_OLLAMA_BASE_URL: "http://ollama-service:11434"
  SPRING_AI_OLLAMA_CHAT_MODEL: "llama3"
  SPRING_AI_OLLAMA_EMBEDDING_MODEL: "nomic-embed-text"
