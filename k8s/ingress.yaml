# ============================================================
# Ingress — External Traffic Routing
# ============================================================
# Ingress is like a smart reverse proxy that routes external HTTP
# traffic to the correct internal service based on URL path.
#
# External request → Ingress Controller → Service → Pod
#
# Example:
#   http://contract-analyzer.com/        → frontend-service
#   http://contract-analyzer.com/api/*   → backend-service

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contract-analyzer-ingress
  namespace: contract-analyzer
  annotations:
    # Use nginx ingress controller (most common)
    kubernetes.io/ingress.class: nginx
    # Enable CORS at the ingress level
    nginx.ingress.kubernetes.io/enable-cors: "true"
    # Increase body size limit for PDF uploads (default is 1MB)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Enable SSE streaming (disable buffering for /api/chat/stream)
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - host: contract-analyzer.example.com   # Replace with your domain
      http:
        paths:
          # Route /api/* requests to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          # Route everything else to frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
